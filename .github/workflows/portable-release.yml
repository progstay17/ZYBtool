name: ZYBTool Portable Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ZYBTool v'))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller==6.19.0
      - name: Build portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ZYBTool --paths src --collect-all metaqr --collect-all av --hidden-import zybtool.gui --hidden-import zybtool.operations --hidden-import zybtool.settings --hidden-import openpyxl --hidden-import av src/zybtool/gui.py
      - name: Add portable instructions and archive
        shell: pwsh
        run: |
          Copy-Item PORTABLE-README.txt dist/ZYBTool/README.txt
          tar -a -c -f dist/ZYBTool-portable-windows-x64.zip -C dist ZYBTool
      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ZYBTool/ZYBTool.exe)) { throw "Portable executable missing" }
          Get-Item dist/ZYBTool/ZYBTool.exe | Format-List Name,Length
      - name: Upload portable ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZYBTool-portable-windows-x64
          path: dist/ZYBTool-portable-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ZYBTool v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/ZYBTool-portable-windows-x64.zip
