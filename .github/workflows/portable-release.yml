name: ZYBTool Portable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: "pip"
      - name: Install application and packager
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller==6.19.0
      - name: Build portable application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ZYBTool --paths src --collect-all metaqr --collect-all av --hidden-import zybtool.gui --hidden-import zybtool.settings --hidden-import av src/zybtool/gui.py
      - name: Add portable instructions and archive
        shell: pwsh
        run: |
          Copy-Item PORTABLE-README.txt dist/ZYBTool/README.txt
          tar -a -c -f dist/ZYBTool-portable-windows-x64.zip -C dist ZYBTool
      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ZYBTool/ZYBTool.exe)) { throw "Portable executable missing" }
          Get-Item dist/ZYBTool/ZYBTool.exe | Format-List Name,Length
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ZYBTool-portable-windows-x64.zip
